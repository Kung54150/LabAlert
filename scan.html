<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LabAlert สแกน HN</title>
<style>
:root{--bg:#EEF2F1;--surface:#fff;--ink:#14211F;--muted:#5B6B68;--line:#CDD7D4;--accent:#0B6158;--accent-ink:#fff;--crit:#B3261E}
@media (prefers-color-scheme:dark){:root{--bg:#0F1716;--surface:#172220;--ink:#E4EEEC;--muted:#93A6A2;--line:#2C3C39;--accent:#4FB7A9;--accent-ink:#06201C;--crit:#F2877F}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,"Noto Sans Thai",sans-serif;padding:16px max(16px,env(safe-area-inset-right)) 32px max(16px,env(safe-area-inset-left))}
main{max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
h1{font-size:1.2rem;margin:0}
.muted{color:var(--muted);font-size:.85rem}
#reader{width:100%;border-radius:12px;overflow:hidden;background:#000;min-height:120px}
button,input{font:inherit;border-radius:10px;border:1px solid var(--line);padding:11px 14px;background:var(--surface);color:var(--ink);width:100%}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.row{display:flex;gap:8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
.err{color:var(--crit);font-size:.9rem}
input{font-family:ui-monospace,monospace;font-size:1.1rem}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <h1>สแกน Barcode / QR ของ HN</h1>
  <div id="setup" class="card" hidden>
    <div>ใส่ลิงก์ Web app ของ LabAlert (ขึ้นต้น https://script.google.com/macros/s/ ลงท้าย /exec) ครั้งเดียว</div>
    <input id="appUrl" placeholder="https://script.google.com/macros/s/.../exec" inputmode="url" autocomplete="off">
    <button class="primary" id="saveApp">บันทึก</button>
    <div class="err" id="setupErr"></div>
  </div>
  <div id="scanner" hidden>
    <div id="reader"></div>
    <div class="muted" id="status">เล็งกล้องไปที่บาร์โค้ดบนสติกเกอร์ผู้ป่วย</div>
    <div class="row"><button id="photo">ถ่ายรูปบาร์โค้ด</button><button id="restart">เริ่มกล้องใหม่</button></div>
    <input type="file" id="file" accept="image/*" capture="environment" hidden>
  </div>
  <div id="result" class="card" hidden>
    <div class="muted">อ่านได้ (แก้ไขได้ถ้ามีตัวอักษรอื่นปน)</div>
    <input id="hn" autocomplete="off">
    <button class="primary" id="use">ใช้ HN นี้ แล้วกลับไปเลือกเวลาแจ้งเตือน</button>
    <button id="again">สแกนใหม่</button>
  </div>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const OK = /^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_\-]+\/(exec|dev)$/; // กัน redirect ไปเว็บอื่น
const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
const qs = new URLSearchParams(location.search);
let app = qs.get('app') || store.get('labalert_app') || '';
if (app && OK.test(app)) store.set('labalert_app', app); else app = '';
let reader = null;

function show(id) { ['setup', 'scanner', 'result'].forEach((x) => ($(x).hidden = x !== id)); }
async function stop() { try { if (reader && reader.isScanning) await reader.stop(); } catch (e) {} }
async function start() {
  show('scanner'); $('status').textContent = 'เล็งกล้องไปที่บาร์โค้ดบนสติกเกอร์ผู้ป่วย';
  await stop();
  try {
    reader = new Html5Qrcode('reader', { experimentalFeatures: { useBarCodeDetectorIfSupported: true } });
    await reader.start({ facingMode: 'environment' }, { fps: 10, qrbox: { width: 280, height: 140 } },
      (txt) => found(txt), () => {});
  } catch (e) {
    $('status').textContent = 'เปิดกล้องไม่ได้ (' + String((e && e.message) || e).slice(0, 80) + ') อนุญาตกล้องให้เบราว์เซอร์ หรือกด “ถ่ายรูปบาร์โค้ด”';
  }
}
async function found(txt) {
  await stop();
  if (navigator.vibrate) navigator.vibrate(80);
  $('hn').value = String(txt).trim(); show('result');
}
$('saveApp').onclick = () => {
  const v = $('appUrl').value.trim();
  if (!OK.test(v)) { $('setupErr').textContent = 'ลิงก์ไม่ถูกต้อง ต้องเป็น Web app URL ที่ลงท้ายด้วย /exec'; return; }
  app = v; store.set('labalert_app', v); start();
};
$('use').onclick = () => {
  const v = $('hn').value.trim();
  if (!v) return;
  location.href = app + '?mode=scan&hn=' + encodeURIComponent(v);
};
$('again').onclick = start;
$('restart').onclick = start;
$('photo').onclick = () => $('file').click();
$('file').onchange = async (e) => {
  const f = e.target.files[0]; if (!f) return;
  await stop();
  try { const h = new Html5Qrcode('reader'); found(await h.scanFile(f, false)); }
  catch (x) { $('status').textContent = 'อ่านจากรูปไม่ได้ ถ่ายให้ใกล้ ชัด และตรงขึ้น หรือใช้กล้องสด'; }
};
if (app) start(); else show('setup');
</script>
</body>
</html>
