<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LabAlert อายุรกรรม</title>
<meta name="theme-color" content="#0B6158">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="LabAlert">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{--bg:#EEF2F1;--surface:#fff;--sunk:#E3E9E7;--line:#CDD7D4;--ink:#14211F;--muted:#5B6B68;--accent:#0B6158;--accent-ink:#fff;
 --ok:#1D7A46;--ok-soft:#DCEFE3;--warn:#9A6100;--warn-soft:#FBEBCB;--crit:#B3261E;--crit-soft:#F8DAD7;
 --f-body:"IBM Plex Sans Thai",system-ui,sans-serif;--f-mono:"IBM Plex Mono",ui-monospace,monospace}
@media (prefers-color-scheme:dark){:root{--bg:#0F1716;--surface:#172220;--sunk:#1E2B29;--line:#2C3C39;--ink:#E4EEEC;--muted:#93A6A2;
 --accent:#4FB7A9;--accent-ink:#06201C;--ok:#6BCB8F;--ok-soft:#173326;--warn:#F0B54A;--warn-soft:#3A2C10;--crit:#F2877F;--crit-soft:#3E1A17}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.35 var(--f-body);padding:6px max(8px,env(safe-area-inset-right)) 84px max(8px,env(safe-area-inset-left))}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:6px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
button{font:inherit;cursor:pointer;border-radius:7px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:4px 10px}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
button.ghost{background:transparent}
button:disabled{opacity:.45;cursor:default}

/* หัวแอป + แท็บ (บาง) */
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:28px}
.top b{font-size:.95rem}.top .who{font-size:.72rem;color:var(--muted);margin-left:4px}
.top .right{display:flex;align-items:center;gap:6px}
.date{font-size:.8rem;font-weight:600}
.top button{padding:1px 8px;font-size:.72rem}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tab{flex:1;border:0;border-bottom:3px solid transparent;border-radius:0;background:transparent;padding:4px 2px;font-size:.78rem;white-space:nowrap}
.tab b{font-size:.9rem;margin-left:3px}
.tab.due{color:var(--crit)}.tab.wait{color:var(--warn)}.tab.done{color:var(--ok)}
.tab[aria-selected="true"]{font-weight:700}
.tab[aria-selected="true"].due{border-bottom-color:var(--crit)}.tab[aria-selected="true"].wait{border-bottom-color:#E2A412}.tab[aria-selected="true"].done{border-bottom-color:var(--ok)}
.exp{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:.8rem;padding:6px 0}
.exq{display:inline-flex;gap:4px}
.exq button{padding:1px 8px;font-size:.75rem}
.exp input{font:inherit;padding:2px 6px}
.daybar{display:flex;align-items:center;gap:8px;font-size:.8rem}
.daybar button{padding:1px 10px}

/* รายการมือถือ: 2 บรรทัดต่อคน */
.list{display:flex;flex-direction:column;gap:3px}
.r{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--line);border-radius:6px;padding:3px 7px}
.r.due{border-left-color:#9E2A22}.r.due.hot{border-left-color:#FF1A1A}.r.wait{border-left-color:#E2A412}.r.done{border-left-color:var(--ok)}
.r.hl{outline:2px solid var(--accent)}
.l1{display:flex;align-items:center;gap:6px}
.q{font-size:.66rem;color:var(--muted);min-width:12px;text-align:right}
.hn{font-weight:600;font-size:.95rem}
.btns{margin-left:auto;display:flex;gap:4px}
.btns button{padding:1px 8px;font-size:.72rem;border-radius:6px}
.l2{font-size:.68rem;color:var(--muted);cursor:pointer;padding-top:1px}
.l2 .red{color:var(--crit)}
.chip{font-size:.66rem;font-weight:600;padding:0 6px;border-radius:99px;white-space:nowrap}
/* ครบเวลายังไม่ตามผล: แดงสดกระพริบ / ตามผลแล้วรอรอบถัดไป: แดงเข้มนิ่ง */
.chip.due{background:#FF1A1A;color:#fff;box-shadow:0 0 0 2px rgba(255,26,26,.35);animation:blink 1s steps(2,start) infinite}
.chip.ack{background:#9E2A22;color:#fff}
.chip.wait{background:var(--warn-soft);color:var(--warn)}.chip.done{background:var(--ok-soft);color:var(--ok)}.chip.stale{background:var(--sunk);color:var(--muted)}
@keyframes blink{50%{opacity:.3}}
@media (prefers-reduced-motion:reduce){.chip.due{animation:none;outline:2px solid var(--crit)}}
.scanning .chip.due{animation:none}   /* เปิดแผ่นสแกนอยู่: หยุดกระพริบด้านหลัง ไม่ให้หน้าจอวูบตอนใช้กล้อง */
.hist{display:grid;grid-template-columns:auto 1fr;gap:1px 8px;font-size:.7rem;border-top:1px dashed var(--line);margin-top:2px;padding-top:3px}
.hist .sys{color:var(--muted)}
.hint{background:var(--warn-soft);color:var(--warn);border-radius:7px;padding:4px 8px;font-size:.75rem;display:flex;justify-content:space-between;align-items:center;gap:6px}
.empty{color:var(--muted);text-align:center;padding:24px 0}

/* ตารางหน้าจอกว้าง: 1 คนต่อ 1 บรรทัด */
.tblwrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:8px}
.tbl{width:100%;border-collapse:collapse;font-size:.8rem}
.tbl th{text-align:left;font-size:.68rem;letter-spacing:.03em;color:var(--muted);font-weight:600;padding:5px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:4px 8px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap}
.tbl tr.due td:first-child{box-shadow:inset 4px 0 #9E2A22}.tbl tr.due.hot td:first-child{box-shadow:inset 4px 0 #FF1A1A}.tbl tr.wait td:first-child{box-shadow:inset 4px 0 #E2A412}.tbl tr.done td:first-child{box-shadow:inset 4px 0 var(--ok)}
.tbl tr.hl td{background:var(--warn-soft)}
.tbl .hrow td{background:var(--bg);white-space:normal}
.tbl .acts{display:flex;gap:4px}.tbl .acts button{padding:1px 8px;font-size:.74rem}
.tbl .tg{border:0;background:transparent;color:var(--accent);padding:0 4px}

.ic{padding:2px 7px;line-height:0}.ic svg{width:15px;height:15px}.ic.warn{border-color:var(--crit);color:var(--crit)}
.fab{position:fixed;right:max(12px,env(safe-area-inset-right));bottom:calc(12px + env(safe-area-inset-bottom,0px));border-radius:99px;padding:9px 16px;box-shadow:0 3px 12px rgba(0,0,0,.3);font-size:.85rem}

/* แผ่นสแกน */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sheet{background:var(--surface);width:min(440px,100%);border-radius:14px 14px 0 0;padding:10px max(12px,env(safe-area-inset-left));display:flex;flex-direction:column;gap:7px;max-height:94%;overflow:auto}
@media(min-width:600px){.sheet-bg{align-items:center}.sheet{border-radius:14px}}
.hnbox{font-size:1.5rem;font-weight:600;text-align:center;padding:6px;border:1px solid var(--line);border-radius:8px;background:var(--bg);min-height:2.4rem}
.hnbox.empty-hn{color:var(--muted);font-size:.9rem;font-weight:400;padding-top:11px}
.row{display:flex;gap:6px;align-items:center;justify-content:space-between}
.row.g button{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:5px}.chips button{flex:1 1 auto;border-radius:99px;font-size:.78rem;padding:3px 6px;white-space:nowrap}
.chips button.sel{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.step{display:flex;align-items:center;justify-content:center;gap:12px}.step b{font-size:1.1rem;min-width:70px;text-align:center}
.step button{width:44px;font-size:1rem}
#reader{width:100%}   /* ห้ามซ่อนกรอบตอนว่าง: ตัวอ่านบาร์โค้ดวัดความกว้างกรอบตอนเริ่ม ถ้า 0 ภาพกล้องจะกว้าง 0 */

/* เข้าสู่ระบบ: ปุ่มกดทั้งหมด ไม่เปิดแป้นพิมพ์ */
.login{max-width:330px;margin:3vh auto 0;display:flex;flex-direction:column;align-items:stretch;gap:10px;text-align:center}
.login h1{font-size:1.2rem;margin:0}
.field{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;border-radius:9px;border:2px solid var(--line);background:var(--surface);text-align:left}
.field .lbl{font-size:.78rem;color:var(--muted)}.field .val{font-size:1.25rem;letter-spacing:.12em;min-height:1.6rem}
.field.on{border-color:var(--accent)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.pad button{height:50px;font-size:1.3rem;border-radius:12px}
.pad button.sm{font-size:.85rem}
.big{padding:12px;font-size:1rem;border-radius:10px}
.err{color:var(--crit);font-size:.8rem;min-height:1.1rem}
.busy{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.3)}
.busy[hidden]{display:none}
.busy .box{background:var(--surface);border-radius:16px;padding:18px;box-shadow:0 4px 20px rgba(0,0,0,.35)}
.spin{width:42px;height:42px;border-radius:50%;border:5px solid var(--line);border-top-color:var(--accent);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(64px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:7px 14px;border-radius:8px;font-size:.82rem;z-index:20;max-width:92%}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="toast" id="toast" hidden></div>
<div class="busy" id="busy" hidden role="status" aria-live="polite" aria-label="กำลังโหลด"><div class="box"><div class="spin"></div></div></div>
<script src="config.js"></script>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
/* ---------- ตั้งค่า ---------- */
const APP_VERSION = '2026-11-10.8';   // แสดงที่หน้าเข้าสู่ระบบ ไว้เช็คว่าเปิดเวอร์ชันล่าสุดอยู่
const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
const qs = new URLSearchParams(location.search);
const API_RE = /^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_\-]+\/(exec|dev)$/;
const EMBEDDED = String((window.LABALERT_CONFIG || {}).apiUrl || '').trim();   // ลิงก์ที่ฝังไว้ใน config.js
const HAS_EMBEDDED = API_RE.test(EMBEDDED);
let API = HAS_EMBEDDED ? EMBEDDED : (store.get('api') || '');
if (!API_RE.test(API)) API = '';
const qApi = qs.get('api') || '';
let pendingApi = !HAS_EMBEDDED && API_RE.test(qApi) && qApi !== API ? qApi : '';   // ลิงก์จาก LINE: ให้ผู้ใช้ยืนยันก่อนเชื่อมต่อ
const CFG = { liffId: '', mode: qs.get('mode') || '', hn: qs.get('hn') || '' };

// เข้าสู่ระบบค้างไว้ในเครื่องจนกว่าจะกด "ออก" (หรือครบ 30 วัน) เปิดจากการแจ้งเตือนหรือลิงก์ใน LINE แล้วเข้าแอปได้เลยไม่ต้องใส่รหัสซ้ำ
const sess = store;

/* ---------- ฟังก์ชันช่วย ---------- */
const $app = document.getElementById('app');
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = (ms) => ms ? new Date(ms).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit', hour12: false, timeZone: 'Asia/Bangkok' }) : '–';
const bkkDay = (ms) => new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Bangkok' }).format(new Date(ms)).replace(/-/g, '');
const utcNoon = (d, add) => new Date(Date.UTC(+d.slice(0, 4), +d.slice(4, 6) - 1, +d.slice(6, 8) + (add || 0), 12));
const dayLabel = (d, weekday) => utcNoon(d).toLocaleDateString('th-TH', { day: 'numeric', month: 'short', year: '2-digit', timeZone: 'UTC', ...(weekday ? { weekday: 'short' } : {}) });
const shiftDay = (d, n) => { const t = utcNoon(d, n); return t.getUTCFullYear() + String(t.getUTCMonth() + 1).padStart(2, '0') + String(t.getUTCDate()).padStart(2, '0'); };
// HN แสดงเป็นรูปแบบ 69-4948: ถ้ามีแต่ตัวเลข (5-10 หลัก) ใส่ขีดหลังเลข 2 หลักแรก
const normHN = (v) => {
  const t = String(v == null ? '' : v).trim();
  if (/^\d{2}-\d+$/.test(t)) return t;
  const d = t.replace(/[\s-]/g, '');
  return /^\d{5,10}$/.test(d) ? d.slice(0, 2) + '-' + d.slice(2) : t;
};
const dur = (m) => m < 60 ? m + ' นาที' : ((m / 60) % 1 ? (m / 60).toFixed(1) : m / 60) + ' ชม.';
const clean = (s) => String(s || '').replace(/(\s*\((แอป|LINE)\))+\s*$/, (m) => (/แอป/.test(m) ? ' (แอป)' : ''));
const mins = (ms) => Math.max(0, Math.round(ms / 60000));

/* ---------- สถานะ ---------- */
let mode = null;                 // 'app' | 'line' | null
let me = null;                   // { code, role }
let appToken = null, mustChange = false;
let lg = { code: store.get('lastCode') || '', pin: '', field: store.get('lastCode') ? 'pin' : 'code', err: '', busy: false };
let cp = { a: '', b: '', field: 'a', err: '', busy: false };
let snap = { now: Date.now(), today: bkkDay(Date.now()), patients: [] }, offset = 0;
let tab = null, doneDay = null;
let hl = CFG.hn || '', hlMode = CFG.mode === 'follow' ? CFG.hn : '';
let scan = null;                 // { hn, wait, custom, pad }
let busy = false, timer = null;
const openH = {};

/* ---------- ตัวหมุนแสดงว่ากำลังโหลด (กลางหน้าจอ) ---------- */
let busyN = 0, busyT = null;
function busyOn() { busyN++; if (busyN === 1) busyT = setTimeout(() => { if (busyN > 0) document.getElementById('busy').hidden = false; }, 150); }   // งานที่เสร็จเร็วกว่า 0.15 วินาทีไม่ต้องกะพริบ
function busyOff() { busyN = Math.max(0, busyN - 1); if (busyN === 0) { clearTimeout(busyT); document.getElementById('busy').hidden = true; } }
async function withBusy(fn) { busyOn(); try { return await fn(); } finally { busyOff(); } }

const request = async (quiet, fn, args) => {
  if (!quiet) busyOn();
  try {
    let r;
    try { r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn, args }) }); }
    catch (e) { throw new Error('เชื่อมต่อระบบไม่ได้ ตรวจอินเทอร์เน็ตหรือลิงก์ Apps Script'); }
    let j;
    try { j = await r.json(); } catch (e) { throw new Error('ระบบตอบกลับผิดรูปแบบ ตรวจว่า Deploy เป็น Anyone และเป็นเวอร์ชันล่าสุด'); }
    if (!j.ok) throw new Error(j.error || 'เกิดข้อผิดพลาด');
    return j.data;
  } finally { if (!quiet) busyOff(); }
};
const call = (fn, ...args) => request(false, fn, args);    // แสดงตัวหมุน
const qcall = (fn, ...args) => request(true, fn, args);    // เงียบ (รีเฟรชอัตโนมัติทุก 20 วินาที)
const nowMs = () => Date.now() + offset;
const auth = () => mode === 'line' ? { type: 'line', accessToken: liff.getAccessToken() } : { type: 'app', token: appToken };
const isAdmin = () => !!(me && me.role === 'Admin');
const isWide = () => window.innerWidth >= 900;
function toast(s) { const t = document.getElementById('toast'); t.textContent = s; t.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => (t.hidden = true), 2600); }
function setSnap(s) { snap = s; offset = s.now - Date.now(); if (s.me) me = s.me; }
function localLogout(msg) {
  mode = null; expo = null; me = null; appToken = null; mustChange = false; sess.set('tok', ''); clearInterval(timer); clearInterval(alertTimer); alertingIds = new Set(); document.title = 'LabAlert อายุรกรรม';
  lg = { code: store.get('lastCode') || '', pin: '', field: store.get('lastCode') ? 'pin' : 'code', err: msg || '', busy: false };
}

/* ---------- ตรรกะสถานะ ---------- */
const REP = 10 * 60000;
const dueAt = (p) => p.reg + p.wait * 60000;
/** จำลองรอบแจ้งเตือน: ครบเวลาแล้วแจ้งทุก 10 นาที ถ้ามีคนตามผลก่อน ข้ามรอบนั้นแล้วนับ 10 นาทีใหม่ (ใช้แสดงเวลารอตอบรับของแอดมิน) */
function sim(p) {
  const al = [], F = p.fols; let nx = dueAt(p), i = 0;
  for (let g = 0; g < 500; g++) {
    while (i < F.length && F[i].at <= nx) { nx = Math.max(nx, F[i].at + REP); i++; }
    if (p.pr && nx >= p.pr) return { al: al, next: null };
    if (nx > nowMs()) return { al: al, next: nx };       // next = เวลาแจ้งเตือนครั้งถัดไป
    al.push(nx); nx += REP;
  }
  return { al: al, next: null };
}
function cat(p) {
  if (p.pr || p.stale) return 'done';
  return sim(p).al.length ? 'due' : 'wait';   // ถึงเวลาแจ้งแล้ว (ตามตารางเวลา) อยู่แท็บครบเวลาต่อแม้กดตามผล ตามผลก่อนถึงเวลาแจ้งอยู่แท็บรอผล
}
/** ตามผลแล้วหลังรอบแจ้งเตือนล่าสุด รอรอบถัดไป (ในแท็บครบเวลา: แดงนิ่ง) */
const acked = (p) => { const lf = p.fols[p.fols.length - 1]; if (!lf) return false; const al = sim(p).al; return !al.length || lf.at >= al[al.length - 1]; };
function cycleStart(p) { const lf = p.fols[p.fols.length - 1]; const a = sim(p).al.filter((t) => !lf || t > lf.at); return a.length ? a[0] : null; }
function respOf(p, k) { const f = p.fols[k], prev = k ? p.fols[k - 1].at : -1; const a = sim(p).al.filter((t) => t > prev && t <= f.at); return a.length ? f.at - a[0] : null; }
function events(p, admin) {
  const ev = [{ t: p.reg, o: 0, txt: 'ลงทะเบียน (รอ ' + dur(p.wait) + ') · ' + clean(p.regBy) }];
  p.fols.forEach((f, k) => {
    let x = 'ตามผลครั้งที่ ' + (k + 1) + ' · ' + clean(f.by);
    if (admin) { const r = respOf(p, k); x += r == null ? ' · ตามก่อนถึงเวลาแจ้ง' : ' · รอตอบรับ ' + mins(r) + ' นาที'; }
    ev.push({ t: f.at, o: 1, txt: x });
  });
  if (p.pr) ev.push({ t: p.pr, o: 2, txt: 'พิมพ์ผล · ' + clean(p.prBy) });
  if (admin) sim(p).al.forEach((t, k) => ev.push({ t: t, o: 1, sys: 1, txt: 'ระบบแจ้งเตือน LINE (' + (k + 1) + ')' }));
  return ev.sort((a, b) => a.t - b.t || a.o - b.o);
}
function chip(p) {
  const s = cat(p);
  if (s === 'done') return p.pr ? '<span class="chip done">พิมพ์แล้ว</span>' : '<span class="chip stale">ไม่ได้พิมพ์ผล</span>';
  if (s === 'due') return acked(p) ? '<span class="chip ack">รออีก ' + Math.max(0, Math.ceil((sim(p).next - nowMs()) / 60000)) + 'น.</span>' : '<span class="chip due">ครบเวลา</span>';

  const admin = isAdmin(), wide = isWide();

    '<div class="right"><span class="date">' + esc(dayLabel(snap.today, true)) + '</span>' + bellBtn() + '' + (admin ? '<button class="ghost" data-act="export">CSV</button>' : '') + '<button class="ghost" data-act="logout">ออก</button></div></div>' + expPanel(admin) +
    '<div class="tabs" role="tablist">' + L.map(([k, l]) => '<button class="tab ' + k + '" role="tab" data-tab="' + k + '" aria-selected="' + (tab === k) + '">' + l + '<b class="mono">' + g[k].length + '</b></button>').join('') + '</div>' + dayBar +
    (list.length ? (wide ? tableW(list, admin) : '<div class="list">' + list.map((p, i) => rowM(p, admin, i + 1)).join('') + '</div>') : '<div class="empty">' + empty + '</div>') +
    '<button class="primary fab" data-act="scan">+ สแกน</button>' + (scan ? scanSheet() : '');
  if (hl) { const el = document.querySelector('.r.hl, tr.hl'); if (el && el.scrollIntoView) el.scrollIntoView({ block: 'center' }); }
}

function loadScript(src) { return new Promise((ok, no) => { const el = document.createElement('script'); el.src = src; el.onload = ok; el.onerror = no; document.head.appendChild(el); }); }
// ลงทะเบียนรับพุช (FCM) ให้เครื่องนี้ ต้องอนุญาตการแจ้งเตือนแล้ว; ไม่รองรับ (เช่น ในแอป LINE) ก็ข้ามไป
async function enablePush() {

    const base = 'https://www.gstatic.com/firebasejs/10.12.2/';

    if (!token) return;
    const mark = token + '|' + (me ? me.code : '');
    if (store.get('fcmMark') !== mark) { await qcall('apiRegisterPush', auth(), token); store.set('fcmMark', mark); }
    store.set('fcmToken', token);

}
let qrP = null;
function loadQr() {   // โหลดตัวอ่านบาร์โค้ดเมื่อกดสแกนครั้งแรกเท่านั้น ไม่หน่วงตอนเปิดแอป

async function startCamera() { await withBusy(startCameraInner); }
// สลับไปกล้องหลังตัวถัดไป (บางรุ่นเลนส์หลักไม่ถูกเลือกอัตโนมัติ) และจำตัวที่เลือกไว้

async function startCameraInner() {
  if (!(await loadQr())) { toast('เปิดกล้องไม่ได้ กด “พิมพ์เอง” แทน'); return; }
  try {
    // ลดชนิดบาร์โค้ดที่ลองอ่านให้เหลือที่ใช้บ่อย ช่วยลดการอ่านเพี้ยน และใช้ตัวอ่านของเบราว์เซอร์ถ้ามี (Chrome บน Android)
    const F = window.Html5QrcodeSupportedFormats || {};
    const formats = ['QR_CODE', 'CODE_128', 'CODE_39', 'EAN_13', 'EAN_8', 'UPC_A', 'ITF'].map((k) => F[k]).filter((v) => v !== undefined);
    const h = new Html5Qrcode('reader', { formatsToSupport: formats.length ? formats : undefined, experimentalFeatures: { useBarCodeDetectorIfSupported: true }, verbose: false });
    window._h = h;
    let last = '', n = 0;   // ต้องอ่านได้ค่าเดียวกัน 2 ครั้งติดกันจึงยอมรับ
    // Android บางรุ่นเมื่อใช้ facingMode อย่างเดียวจะได้เลนส์ไวด์/มาโครที่โฟกัสไม่ได้ จึงเลือกกล้องหลักหลังเครื่องเอง
    let cam = { facingMode: 'environment' };
    try {
      const cams = await Html5Qrcode.getCameras();
      let backs = (cams || []).filter((c) => /back|rear|environment|หลัง/i.test(c.label || ''));
      if (!backs.length) backs = cams || [];
      const bad = /wide|ultra|macro|tele|depth|mono|0\.5|zoom/i;
      let saved = null; try { saved = localStorage.getItem('labalert_cam'); } catch (e) {}
      const main = saved !== null && backs.length ? backs[(+saved || 0) % backs.length] : (backs.find((c) => !bad.test(c.label)) || backs[0]);
      if (backs.length > 1) toast('กล้อง ' + (backs.indexOf(main) + 1) + '/' + backs.length + ' (กด “สลับกล้อง” ถ้าภาพไม่ชัด)');
      if (main && main.id) cam = { deviceId: { exact: main.id } };
    } catch (e) { /* ใช้ facingMode ตามเดิม */ }

    try { await h.start(cam.deviceId ? cam.deviceId.exact : cam, cfg, onScan, () => {}); }
    catch (e) { try { await h.stop(); } catch (_) {} await h.start({ facingMode: 'environment' }, { fps: 10, qrbox: cfg.qrbox }, onScan, () => {}); }
    // ขอให้โฟกัสต่อเนื่องหลังกล้องเปิด (ถ้าเครื่องรองรับ)
    try {
      const track = document.querySelector('#reader video')?.srcObject?.getVideoTracks?.()[0];
      const caps = track && track.getCapabilities ? track.getCapabilities() : {};
      if (track && caps.focusMode && caps.focusMode.includes('continuous')) await track.applyConstraints({ advanced: [{ focusMode: 'continuous' }] });
    } catch (e) { /* ข้ามได้ */ }
    function onScan(txt) {
        txt = String(txt).trim();
        if (txt === last) n++; else { last = txt; n = 1; }
        if (n >= 2) { scan.hn = normHN(txt); Promise.resolve(h.stop()).catch(() => {}).then(() => { toast('อ่านได้ ' + normHN(txt) + ' ตรวจให้ตรงกับสติกเกอร์'); render(); }); }
    }
  } catch (e) { toast('เปิดกล้องสดไม่ได้ (' + String((e && e.message) || e).slice(0, 60) + ') ลองกด “ถ่ายรูป” แทน'); }
}

    const hn = normHN(scan.hn), w = scanWait();
    if (!/^[0-9A-Za-z\-\/]{3,20}$/.test(hn)) { toast('กรอก HN ก่อน (สแกนหรือกด “พิมพ์เอง”)'); return; }
    if (await doCall('apiAdd', hn, w)) { scan = null; hl = ''; tab = 'wait'; toast('เพิ่ม HN ' + hn + ' แล้ว แจ้งเตือน ' + fmt(nowMs() + w * 60000)); render(); }
    return;
  }
  if (d.do === 'follow') { if (await doCall('apiFollow', d.id)) { hlMode = ''; hl = ''; toast('บันทึกตามผลแล้ว ระบบแจ้งอีกครั้งใน 10 นาที'); render(); } return; }
  if (d.do === 'print') { if (await doCall('apiPrint', d.id)) { toast('บันทึกพิมพ์ผลแล้ว ย้ายไปแท็บเสร็จสิ้น'); render(); } return; }
  if (d.hist) { openH[d.hist] = !openH[d.hist]; render(); return; }
});
document.addEventListener('click', (e) => { const l = e.target.closest && e.target.closest('.l2'); if (l && l.dataset.hist) { openH[l.dataset.hist] = !openH[l.dataset.hist]; render(); } });
boot();
</script>
</body>
</html>
